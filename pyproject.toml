[project]
name = "ato-vmt-data-pipeline"
version = "0.1.0"
description = "Offline data pipeline that builds ATO and VMT web-map artifacts."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "geopandas>=0.14",
    "duckdb>=0.10",
    "dbfread>=2.0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
